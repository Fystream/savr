<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F3F0E8">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Savr</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%20120%20120%22%3E%3Crect%20width%3D%22120%22%20height%3D%22120%22%20rx%3D%2228%22%20fill%3D%22%23F3F0E8%22/%3E%3Crect%20x%3D%2230%22%20y%3D%2220%22%20width%3D%2252%22%20height%3D%2232%22%20rx%3D%225%22%20fill%3D%22%237FA877%22/%3E%3Crect%20x%3D%2222%22%20y%3D%2238%22%20width%3D%2276%22%20height%3D%2256%22%20rx%3D%2213%22%20fill%3D%22%23141714%22/%3E%3Crect%20x%3D%2262%22%20y%3D%2254%22%20width%3D%2238%22%20height%3D%2224%22%20rx%3D%2212%22%20fill%3D%22%232E342E%22/%3E%3Ccircle%20cx%3D%2275%22%20cy%3D%2266%22%20r%3D%225%22%20fill%3D%22%237FA877%22/%3E%3C/svg%3E">
<style>
@font-face{font-family:'Geist';src:url(fonts/Geist-Variable.woff2) format('woff2');font-weight:100 900;font-display:swap}
@font-face{font-family:'Geist Mono';src:url(fonts/GeistMono-Variable.woff2) format('woff2');font-weight:100 900;font-display:swap}
html,body{overscroll-behavior:none;-webkit-user-select:none;user-select:none}input,textarea{-webkit-user-select:text;user-select:text}
:root{--bg:#F3F0E8;--ink:#141714;--muted:#5A5E57;--card:#FFFFFF;--line:#DDD7C9;--sage:#A8C79F;--sage-soft:#DCE4D6;--sage-ink:#2F4A35;--good:#3F6B47;--bad:#A3392B;--dark2:#2C312B;--mono:'Geist Mono',ui-monospace,monospace}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Geist,Inter,system-ui,sans-serif;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.app{max-width:480px;margin:0 auto;min-height:100vh;padding:calc(20px + env(safe-area-inset-top)) 20px 120px;display:flex;flex-direction:column;gap:14px}
.mono{font-family:var(--mono);font-size:12px;letter-spacing:.04em;color:var(--muted);text-transform:uppercase}
.top{display:flex;justify-content:space-between;align-items:center;min-height:44px;gap:10px}
.avatar{width:44px;height:44px;border-radius:50%;border:0;background:var(--ink);color:var(--sage);font-weight:600;font-size:16px;flex:none}
.lv{display:inline-flex;align-items:center;gap:6px;background:var(--sage-soft);color:var(--sage-ink);border:0;border-radius:99px;padding:0 10px;min-height:28px;font-family:var(--mono);font-size:11px;letter-spacing:.04em;text-transform:uppercase}
.big{font-size:clamp(48px,16vw,64px);font-weight:600;letter-spacing:-.05em;line-height:1}
.row{display:flex;gap:8px}
.wrap{flex-wrap:wrap}
.btn{flex:1;min-height:52px;border-radius:99px;border:1px solid #CFC9BA;background:transparent;font-weight:600;font-size:15px;padding:0 18px}
.btn.dark{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn.sage{background:var(--sage);color:var(--ink);border-color:var(--sage)}
.btn.small{min-height:44px;flex:none;font-size:14px}
.btn.danger{color:var(--bad);border-color:#E3C2BA}
.btn:disabled{opacity:.45;cursor:default}
.card{background:var(--card);border-radius:18px;padding:16px}
.stack{display:flex;flex-direction:column;gap:12px}
.dark-card{background:var(--ink);color:var(--bg);border-radius:22px;padding:18px 20px;display:flex;flex-direction:column;gap:12px}
.dark-card .mono{color:#B9BDB3}
.blocks{display:grid;grid-template-columns:repeat(20,minmax(0,1fr));gap:3px}
.blocks span{height:22px;border-radius:3px;background:var(--dark2)}
.blocks span.on{background:var(--sage)}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.stat{font-size:22px;font-weight:600;letter-spacing:-.03em}
.linkcard{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:0}
h2{font-size:22px;letter-spacing:-.03em;margin:4px 0 0}
.muted{color:var(--muted)}
.good{color:var(--good)}.bad{color:var(--bad)}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field label{font-family:var(--mono);font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.input{min-height:48px;border-radius:14px;border:1px solid #CFC9BA;background:#FFFFFF;padding:0 14px;font-size:16px;width:100%;min-width:0}
.amount{font-size:40px;font-weight:600;letter-spacing:-.04em;min-height:72px;text-align:center}
.seg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));background:#E6E1D4;border-radius:99px;padding:4px;gap:4px}
.seg.two{grid-template-columns:repeat(2,minmax(0,1fr))}
.seg button{min-height:44px;border:0;border-radius:99px;background:transparent;font-weight:600}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.chip{min-height:40px;padding:0 14px;border-radius:99px;border:1px solid #CFC9BA;background:#FFFFFF;font-size:14px;font-weight:500}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
nav.tabs{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom));width:min(440px,calc(100% - 40px));height:64px;background:var(--ink);border-radius:99px;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));align-items:center;z-index:5}
nav.tabs button{border:0;background:none;color:#9CA197;display:grid;place-items:center;min-height:48px}
nav.tabs button[aria-current="page"]{color:var(--sage)}
nav.tabs .plus{width:46px;height:46px;border-radius:50%;background:var(--sage);display:grid;place-items:center}
.overlay{position:fixed;inset:0;background:rgba(20,23,20,.45);display:flex;align-items:flex-end;justify-content:center;z-index:10}
.sheet{background:var(--bg);width:100%;max-width:480px;max-height:92vh;overflow:auto;border-radius:26px 26px 0 0;padding:20px 20px calc(24px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:14px}
.sheet-head{display:flex;justify-content:space-between;align-items:center}
.x{width:44px;height:44px;border-radius:50%;border:0;background:#E6E1D4;display:grid;place-items:center;flex:none}
.list-row{display:flex;align-items:center;gap:12px;padding:12px 4px;border:0;border-bottom:1px solid var(--line);background:none;width:100%;text-align:left;min-height:56px}
.dot{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;flex:none;font-weight:600}
.badge{background:var(--card);border-radius:16px;padding:14px 10px;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;font-size:12px;font-weight:600}
.badge.locked{opacity:.38}
.badge .ic{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--sage-soft)}
.badge.on .ic{background:var(--ink)}
.toast{position:fixed;left:50%;transform:translateX(-50%);top:calc(16px + env(safe-area-inset-top));background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:99px;font-weight:600;font-size:14px;z-index:20;max-width:calc(100% - 32px);text-align:center}
.toast.win{background:var(--sage);color:var(--ink)}
.err{color:var(--bad);font-size:14px;font-weight:500}
.note{background:var(--sage-soft);color:var(--sage-ink);border-radius:16px;padding:14px 16px;font-size:14px;line-height:1.45}
.note.warn{background:#F4E3D7;color:#7A3417}
.days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.days span{height:8px;border-radius:99px;background:#E6E1D4}
.days span.on{background:var(--sage-ink)}
.stepper{display:flex;align-items:center;gap:8px}
.stepper button{width:48px;height:48px;border-radius:50%;border:1px solid #CFC9BA;background:#FFFFFF;font-size:22px;flex:none}
textarea.input{min-height:120px;padding:12px 14px;font-family:var(--mono);font-size:12px}
.sync{font-family:var(--mono);font-size:11px;color:var(--muted);text-align:center}
.bar{height:8px;border-radius:99px;background:#E6E1D4;overflow:hidden}
.bar>span{display:block;height:100%;background:var(--ink);border-radius:99px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.mini-x{width:44px;height:44px;border:0;background:none;display:grid;place-items:center;color:var(--muted);flex:none}
#fx{position:fixed;inset:0;pointer-events:none;z-index:30;overflow:hidden}
#fx i{position:absolute;top:-12px;width:8px;height:12px;border-radius:2px;animation:fall 1.6s ease-in forwards}
@keyframes fall{to{transform:translateY(105vh) rotate(540deg);opacity:.6}}
@media (prefers-reduced-motion:reduce){#fx{display:none}}
</style>
</head>
<body>
<div class="app" id="app"></div>
<nav class="tabs" id="tabs" aria-label="Main"></nav>
<div id="layer"></div>
<div id="toast" role="status" aria-live="polite"></div>
<div id="fx" aria-hidden="true"></div>
<script>
(function(){
'use strict';
var KEY='stash-v1';
var IN_CATS=['Pocket money','Gift','Earned','Other'];
var OUT_CATS=['Food','Games','Shopping','Going out','School','Other'];
var START='Starting balance',DEBT_OUT='Debt payment',DEBT_IN='Paid back to me';
var NONSTAT=[START,DEBT_OUT,DEBT_IN];
var DAY=86400000;
var USES=[['track','Track my money','See your cash and bank balance in one place, always up to date.'],['goal','Save for a goal','Set a target and a date. Savr shows your progress and the pace you need.'],['limit','Spend less','A weekly spending limit that adjusts itself, plus daily streaks.'],['debts','Track debts','Keep a clear record of who you owe and who owes you.'],['wish','Plan purchases','A wishlist with a 48-hour cool-off before you buy.']];
function has(p,k){return !p||!p.uses||p.uses.indexOf(k)>=0}
function yearOut(){var d=new Date();d.setFullYear(d.getFullYear()+1);return dkey(d.getTime())}
function LOGO(sz){return '<svg width="'+sz+'" height="'+sz+'" viewBox="0 0 120 120" role="img" aria-label="Savr logo"><rect width=\"120\" height=\"120\" rx=\"28\" fill=\"#F3F0E8\"/><rect x=\"30\" y=\"20\" width=\"52\" height=\"32\" rx=\"5\" fill=\"#7FA877\"/><rect x=\"22\" y=\"38\" width=\"76\" height=\"56\" rx=\"13\" fill=\"#141714\"/><rect x=\"62\" y=\"54\" width=\"38\" height=\"24\" rx=\"12\" fill=\"#2E342E\"/><circle cx=\"75\" cy=\"66\" r=\"5\" fill=\"#7FA877\"/></svg>'}
var LEVELS=[['Rookie',0],['Saver',100],['Stacker',300],['Planner',600],['Pro',1000],['Boss',1600],['Legend',2500]];

var S=null;try{S=JSON.parse(localStorage.getItem(KEY)||'null')}catch(e){S=null}
if(!S||!S.profiles)S={v:1,active:null,profiles:[],data:{},updatedAt:0};
var tab='home', histFilter='all', sheet=null, syncNote='', debtForm={dir:'owe',who:'',amt:'',err:''}, wishForm={name:'',price:'',err:''};

/* ---------- helpers ---------- */
function $(id){return document.getElementById(id)}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function newId(){return Math.random().toString(36).slice(2,9)+Date.now().toString(36)}
function money(n){var neg=n<0;n=Math.abs(Math.round(n*100)/100);var s=n.toLocaleString('en-IN',{maximumFractionDigits:2});return (neg?'−':'')+'₹'+s}
function pad(n){return (n<10?'0':'')+n}
function dkey(t){var d=new Date(t);return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function mkey(t){var d=new Date(t);return d.getFullYear()+'-'+pad(d.getMonth()+1)}
function startOfDay(t){var d=new Date(t);d.setHours(0,0,0,0);return d.getTime()}
function weekStart(t){var d=new Date(startOfDay(t));var w=(d.getDay()+6)%7;d.setDate(d.getDate()-w);return d.getTime()}
function addDays(t,n){var d=new Date(t);d.setDate(d.getDate()+n);return d.getTime()}
function niceDate(t){return new Date(t).toLocaleDateString('en-IN',{day:'numeric',month:'short',year:'numeric'})}
function parseAmt(v){var n=parseFloat(String(v).replace(/[^0-9.]/g,''));return isFinite(n)?Math.round(n*100)/100:NaN}
function P(){return S.active?S.data[S.active]:null}
function prof(){for(var i=0;i<S.profiles.length;i++)if(S.profiles[i].id===S.active)return S.profiles[i];return null}
function initial(n){n=(n||'').trim();return n?n[0].toUpperCase():'?'}
function isReal(e){return NONSTAT.indexOf(e.cat)<0}
function curWk(){return dkey(weekStart(Date.now()))}

/* ---------- migrate ---------- */
function migrate(p){if(!p)return;if(!p.uses)p.uses=['track','goal','limit','debts','wish'];if(!p.limitMode)p.limitMode='auto';if(!p.limitHist){p.limitHist={};if(p.limit!=null)p.limitHist[dkey(weekStart(p.created))]=p.limit}
  if(!p.debts)p.debts=[];if(!p.checkins)p.checkins={};if(!p.wish)p.wish=[];if(!p.monthIncome)p.monthIncome={};if(!p.seen)p.seen=[];if(!p.challengesDone)p.challengesDone=[]}

/* ---------- math ---------- */
function balances(p,exclude){var b={cash:0,bank:0};p.entries.forEach(function(e){if(e.id===exclude)return;if(e.type==='in')b[e.acct]+=e.amt;else if(e.type==='out')b[e.acct]-=e.amt;else if(e.type==='move'){b[e.acct]-=e.amt;b[e.to]+=e.amt}});b.cash=Math.round(b.cash*100)/100;b.bank=Math.round(b.bank*100)/100;b.total=Math.round((b.cash+b.bank)*100)/100;return b}
function sumWhere(p,fn){var s=0;p.entries.forEach(function(e){if(fn(e))s+=e.amt});return Math.round(s*100)/100}
function spentOn(p,day){return sumWhere(p,function(e){return e.type==='out'&&isReal(e)&&dkey(e.t)===day})}
function addedOn(p,day){return sumWhere(p,function(e){return e.type==='in'&&isReal(e)&&dkey(e.t)===day})}
function weekSpent(p,ws){var we=addDays(ws,7);return sumWhere(p,function(e){return e.type==='out'&&isReal(e)&&e.t>=ws&&e.t<we})}
function weekNetAt(p,ws){var we=addDays(ws,7);var n=0;p.entries.forEach(function(e){if(!isReal(e)||e.t<ws||e.t>=we)return;if(e.type==='in')n+=e.amt;if(e.type==='out')n-=e.amt});return n}
function monthAuto(p,mk){return sumWhere(p,function(e){return e.type==='in'&&isReal(e)&&mkey(e.t)===mk})}
function limitForWeek(p,ws){var k=dkey(ws),h=p.limitHist||{};if(h[k]!=null)return h[k];var best=null,bk='';Object.keys(h).forEach(function(x){if(x<=k&&x>bk){bk=x;best=h[x]}});return best}
function L(p){return limitForWeek(p,weekStart(Date.now()))}
function dayOk(p,day){var parts=day.split('-');var t=new Date(+parts[0],+parts[1]-1,+parts[2]).getTime();var lim=limitForWeek(p,weekStart(t));return lim!=null&&spentOn(p,day)<=lim/7+1e-9}
function streak(p){if(L(p)==null)return 0;var n=0,t=startOfDay(Date.now()),c=startOfDay(p.created);while(t>=c){if(dayOk(p,dkey(t)))n++;else break;t=addDays(t,-1)}return n}
function bestStreak(p){var best=0,run=0,t=startOfDay(p.created),end=startOfDay(Date.now());while(t<=end){if(dayOk(p,dkey(t))){run++;if(run>best)best=run}else run=0;t=addDays(t,1)}return best}
function okDays(p){var n=0,t=startOfDay(p.created),end=startOfDay(Date.now());while(t<=end){if(dayOk(p,dkey(t)))n++;t=addDays(t,1)}return n}
function pace(p){var since=Date.now()-28*DAY,net=0;p.entries.forEach(function(e){if(!isReal(e)||e.t<since)return;if(e.type==='in')net+=e.amt;if(e.type==='out')net-=e.amt});var days=Math.min(28,Math.max(7,(Date.now()-p.created)/DAY));return net/days*7}
function goalInfo(p){var b=balances(p);var g=p.goal.amount||0;var rem=Math.max(0,g-b.total);var pct=g>0?Math.min(100,b.total/g*100):0;if(pct<0)pct=0;
  var dl=new Date(p.goal.deadline+'T23:59:59').getTime();var weeksLeft=(dl-Date.now())/(7*DAY);var past=!(weeksLeft>0);
  var perWeek=past?null:rem/Math.max(weeksLeft,1/7);var monthsLeft=past?null:Math.max(weeksLeft/4.345,1/4.345);var perMonth=past?null:rem/monthsLeft;
  var pc=pace(p);var eta=(rem>0&&pc>0)?Date.now()+rem/pc*7*DAY:null;
  return {total:b.total,goal:g,rem:rem,pct:pct,deadline:dl,past:past,perWeek:perWeek,perMonth:perMonth,pace:pc,eta:eta}}
function incomeBasis(p){var mk=mkey(Date.now());var o=p.monthIncome&&p.monthIncome[mk];if(o!=null&&o!=='')return {amt:Number(o),src:'typed'};
  var span=Math.min(90,Math.max(30,(Date.now()-p.created)/DAY));var since=Date.now()-span*DAY;var s=sumWhere(p,function(e){return e.type==='in'&&isReal(e)&&e.t>=since});return {amt:s/span*30.4,src:'logged'}}
function calcWeekly(p){var gi=goalInfo(p);var ib=incomeBasis(p);var need=gi.past?0:gi.perMonth;var left=ib.amt-need;return {inc:ib.amt,src:ib.src,need:need,gap:left,weekly:Math.max(0,Math.floor(left/4.345/10)*10)}}
function ensureAuto(p,force){if(p.limitMode!=='auto')return false;var wk=curWk();if(!force&&p.autoLimit&&p.autoLimit.week===wk)return false;var v=calcWeekly(p).weekly;p.autoLimit={week:wk,value:v};p.limit=v;p.limitHist[wk]=v;return true}
function weeksSinceEpoch(t){return Math.round((weekStart(t)-weekStart(0))/(7*DAY))}
function challenge(p){var ws=weekStart(Date.now());var idx=((weeksSinceEpoch(Date.now())%4)+4)%4;if(idx===2&&L(p)==null)idx=0;var days=[];for(var i=0;i<7;i++){var t=addDays(ws,i);days.push({t:t,key:dkey(t),future:t>startOfDay(Date.now())})}
  var born=startOfDay(p.created);var c;
  if(idx===0)c={title:'3 no-spend days this week',target:3,hits:days.map(function(d){return !d.future&&d.t>=born&&spentOn(p,d.key)===0})};
  else if(idx===1)c={title:'Add money on 4 days this week',target:4,hits:days.map(function(d){return !d.future&&addedOn(p,d.key)>0})};
  else if(idx===2)c={title:'Stay under your daily share all week',target:7,hits:days.map(function(d){return !d.future&&d.t>=born&&dayOk(p,d.key)})};
  else c={title:'Log something 5 days this week',target:5,hits:days.map(function(d){return !d.future&&p.entries.some(function(e){return isReal(e)&&dkey(e.t)===d.key})})};
  c.count=c.hits.filter(Boolean).length;c.done=c.count>=c.target;c.week=dkey(ws);return c}
function underLimitWeek(p){var ws=weekStart(p.created);if(startOfDay(p.created)>ws)ws=addDays(ws,7);var cur=weekStart(Date.now());while(ws<cur){var lim=limitForWeek(p,ws);if(lim!=null&&weekSpent(p,ws)<=lim)return true;ws=addDays(ws,7)}return false}
function stats(p){var sp={},ad={},logged={},earnDays={},inc=0,mNet={},mInc={},mOut={};
  p.entries.forEach(function(e){if(!isReal(e)||e.type==='move')return;var k=dkey(e.t),m=mkey(e.t);logged[k]=1;
    if(e.type==='out'){sp[k]=(sp[k]||0)+e.amt;mNet[m]=(mNet[m]||0)-e.amt;mOut[m]=(mOut[m]||0)+e.amt}
    else{ad[k]=(ad[k]||0)+e.amt;inc+=e.amt;mNet[m]=(mNet[m]||0)+e.amt;mInc[m]=(mInc[m]||0)+e.amt;if(e.cat==='Earned')earnDays[k]=1}});
  Object.keys(p.checkins||{}).forEach(function(k){logged[k]=1});
  var today=startOfDay(Date.now()),born=startOfDay(p.created),st={best:0,ok:0,noSpend:0,noSpendRun:0,logged:Object.keys(logged).length,earnDays:Object.keys(earnDays).length,inc:inc};
  var run=0,nrun=0;for(var t=born;t<=today;t=addDays(t,1)){var k=dkey(t),lim=limitForWeek(p,weekStart(t)),s=sp[k]||0;
    if(lim!=null&&s<=lim/7+1e-9){run++;st.ok++;if(run>st.best)st.best=run}else run=0;
    if(t<today){if(s===0){st.noSpend++;nrun++;if(nrun>st.noSpendRun)st.noSpendRun=nrun}else nrun=0}}
  var ws=weekStart(p.created);if(born>ws)ws=addDays(ws,7);var cur=weekStart(Date.now());st.underWeeks=0;st.underRun=0;st.perfectWeeks=0;var ur=0;
  for(;ws<cur;ws=addDays(ws,7)){var tot=0,all=true;for(var i=0;i<7;i++){var dk=dkey(addDays(ws,i));tot+=sp[dk]||0;if(!logged[dk])all=false}var l=limitForWeek(p,ws);
    if(l!=null&&tot<=l){st.underWeeks++;ur++;if(ur>st.underRun)st.underRun=ur}else ur=0;if(all)st.perfectWeeks++}

  app.innerHTML=v+(syncNote?'<div class="sync">'+esc(syncNote)+'</div>':'');
  var t=[['home','home','Home'],['plan','plan','Plan'],['add','plus','Add'],['rewards','reward','Rewards'],['history','hist','History']];
  $('tabs').innerHTML=t.map(function(x){if(x[0]==='add')return '<button data-a="add" data-type="in" aria-label="Add entry"><span class="plus">'+ic('plus',22,'#141714',2.5)+'</span></button>';return '<button data-a="tab" data-tab="'+x[0]+'" aria-label="'+x[2]+'" '+(tab===x[0]?'aria-current="page"':'')+'>'+ic(x[1])+'</button>'}).join('');
  $('layer').innerHTML=sheetHTML()}
function rerenderSheet(){var a=document.activeElement,id=a&&a.id,pos=a&&a.selectionStart;$('layer').innerHTML=sheetHTML();if(id){var el=$(id);if(el){el.focus();try{if(pos!=null)el.setSelectionRange(pos,pos)}catch(e){}}}}
function rerenderApp(){var a=document.activeElement,id=a&&a.id,pos=a&&a.selectionStart;render();if(id){var el=$(id);if(el){el.focus();try{if(pos!=null)el.setSelectionRange(pos,pos)}catch(e){}}}}
function newSetup(step){return {kind:'setup',step:step,uses:['track'],name:'',cash:'',bank:'',goal:'',deadline:yearOut()}}
function boot(){S.profiles.forEach(function(pr){migrate(S.data[pr.id])});if(!P()&&S.profiles.length)S.active=S.profiles[0].id;var ch=false;S.profiles.forEach(function(pr){if(ensureAuto(S.data[pr.id]))ch=true});if(P())checkAch(true);if(ch)save();render()}

/* ---------- actions ---------- */
function openAdd(type,id,pre){var p=P();if(id){var e=p.entries.filter(function(x){return x.id===id})[0];if(!e)return;sheet={kind:'add',editId:id,type:e.type,amt:String(e.amt),acct:e.acct,cat:e.cat,note:e.note||'',date:dkey(e.t),debtLocked:!!e.debtId}}
  else{sheet={kind:'add',type:type,amt:'',acct:'cash',cat:type==='in'?IN_CATS[0]:OUT_CATS[0],note:'',date:dkey(Date.now())};if(pre)for(var k in pre)sheet[k]=pre[k]}
  render();setTimeout(function(){var el=$('amt');if(el&&!id)el.focus()},50)}
function saveEntry(){var p=P(),s=sheet;var amt=parseAmt(s.amt);if(!(amt>0)){s.err='Type an amount above ₹0.';return rerenderSheet()}
  var b=balances(p,s.editId);var from=s.acct;
  if((s.type==='out'||s.type==='move')&&amt>b[from]+1e-9){s.err='You only have '+money(b[from])+' in '+(from==='cash'?'cash':'your bank card')+'. Check the amount.';return rerenderSheet()}
  var old=s.editId?p.entries.filter(function(x){return x.id===s.editId})[0]:null;
  if(old&&old.debtId){var dd=p.debts.filter(function(x){return x.id===old.debtId})[0];if(dd&&amt-old.amt>dd.amt+1e-9){s.err='That’s more than what’s left on this debt ('+money(dd.amt)+').';return rerenderSheet()}}
  if(!old&&b.cash<0&&from==='cash'){}
  var parts=s.date.split('-');var t=s.date===dkey(Date.now())?Date.now():new Date(+parts[0],+parts[1]-1,+parts[2],12).getTime();
  if(old&&old.cat===START)t=old.t;
  var entry={id:s.editId||newId(),t:t,type:s.type,amt:amt,acct:from,cat:s.type==='move'?'Move':s.cat,note:(s.note||'').trim()};if(s.type==='move')entry.to=from==='cash'?'bank':'cash';
  if(old&&old.debtId){entry.debtId=old.debtId;adjustDebt(p,old.debtId,old.amt-amt)}
  if(s.editId){p.entries=p.entries.map(function(x){return x.id===s.editId?entry:x})}else p.entries.push(entry);
  if(s.wishId&&s.type==='out'){p.wish=p.wish.filter(function(w){return w.id!==s.wishId});p.wishBought=true}
  if(p.limitMode==='auto'&&(entry.type==='in'||(old&&old.type==='in')))ensureAuto(p,true);sheet=null;checkAch(false);save();render();if(!document.querySelector('.toast.win'))toast(s.editId?'Saved':(s.type==='in'?'Added '+money(amt):s.type==='out'?'Logged '+money(amt):'Moved '+money(amt)))}
function adjustDebt(p,id,delta){var d=p.debts.filter(function(x){return x.id===id})[0];if(!d)return;d.amt=Math.max(0,Math.round((d.amt+delta)*100)/100);d.settled=d.amt<=0}
function setLimit(v){var p=P();if(v===''||v==null){p.limit=null;delete p.limitHist[curWk()]}else{var n=Math.max(0,Math.round(parseAmt(v)));if(!isFinite(n))return;p.limit=n;p.limitHist[curWk()]=n}checkAch(true);save()}

document.addEventListener('click',function(ev){var el=ev.target.closest('[data-a]');if(!el)return;var a=el.getAttribute('data-a');var p=P();
  if(a==='bg'){if(ev.target!==el)return;sheet=null;return render()}
  if(a==='close'){sheet=null;return render()}
  if(a==='tab'){tab=el.getAttribute('data-tab');window.scrollTo(0,0);return render()}
  if(a==='add')return openAdd(el.getAttribute('data-type'));
  if(a==='edit')return openAdd(null,el.getAttribute('data-id'));
  if(a==='hf'){histFilter=el.getAttribute('data-f');return render()}
  if(a==='checkNone'){p.checkins[dkey(Date.now())]=1;var bl=level(p).n;checkAch(false);save();render();if(!document.querySelector('.toast.win'))toast('+5 XP — a no-spend day',true);return}
  if(a==='recapOk'){p.recapSeen=dkey(addDays(weekStart(Date.now()),-7));save();return render()}
  if(a==='stype'){var ty=el.getAttribute('data-type');if(ty!==sheet.type){sheet.type=ty;if(NONSTAT.indexOf(sheet.cat)<0)sheet.cat=ty==='in'?IN_CATS[0]:OUT_CATS[0];sheet.err=''}return rerenderSheet()}
  if(a==='sacct'){sheet.acct=el.getAttribute('data-v');sheet.err='';return rerenderSheet()}
  if(a==='scat'){sheet.cat=el.getAttribute('data-v');return rerenderSheet()}
  if(a==='saveEntry')return saveEntry();
  if(a==='delEntry'){if(!sheet.confirmDel){sheet.confirmDel=true;return rerenderSheet()}var id=sheet.editId;var b=balances(p,id);if(b.cash<-1e-9||b.bank<-1e-9){sheet.err='Can’t delete: later spending depends on this money. Edit or delete those first.';sheet.confirmDel=false;return rerenderSheet()}
    var e=p.entries.filter(function(x){return x.id===id})[0];if(e&&e.debtId)adjustDebt(p,e.debtId,e.amt);p.entries=p.entries.filter(function(x){return x.id!==id});sheet=null;checkAch(true);save();render();return toast('Deleted')}
  if(a==='mode'){p.limitMode=el.getAttribute('data-v');if(p.limitMode==='auto')ensureAuto(p,true);save();return render()}
  if(a==='recalc'){ensureAuto(p,true);checkAch(true);save();render();return toast('Weekly limit: '+money(p.limit))}
  if(a==='lim'){var cur=L(p)||0;setLimit(Math.max(0,cur+Number(el.getAttribute('data-d'))));return render()}
  if(a==='addWish'){var nm=wishForm.name.trim(),pr=parseAmt(wishForm.price);if(!nm){wishForm.err='Name the item.';return rerenderApp()}if(!(pr>0)){wishForm.err='Add a price above ₹0.';return rerenderApp()}p.wish.push({id:newId(),name:nm,price:pr,t:Date.now()});wishForm={name:'',price:'',err:''};save();return render()}
  if(a==='delWish'){var wid=el.getAttribute('data-id');var ww=p.wish.filter(function(x){return x.id===wid})[0];if(ww&&Date.now()-(ww.t||0)>=COOL){p.resisted=true;p.resistedCount=(p.resistedCount||0)+1;p.resistedSum=(p.resistedSum||0)+ww.price;checkAch(false)}p.wish=p.wish.filter(function(w){return w.id!==wid});save();return render()}
  if(a==='buyWish'){var w=p.wish.filter(function(x){return x.id===el.getAttribute('data-id')})[0];if(!w)return;return openAdd('out',null,{amt:String(w.price),cat:'Shopping',note:w.name,wishId:w.id})}
  if(a==='ddir'){debtForm.dir=el.getAttribute('data-v');return render()}
  if(a==='addDebt'){var who=debtForm.who.trim(),am=parseAmt(debtForm.amt);if(!who){debtForm.err='Who is it?';return rerenderApp()}if(!(am>0)){debtForm.err='Amount must be above ₹0.';return rerenderApp()}
    p.debts.push({id:newId(),who:who,dir:debtForm.dir,amt:am,orig:am,created:Date.now(),settled:false});debtForm={dir:debtForm.dir,who:'',amt:'',err:''};save();render();return toast('Debt added')}
  if(a==='payDebt'){var d=p.debts.filter(function(x){return x.id===el.getAttribute('data-id')})[0];sheet={kind:'debtpay',debtId:d.id,amt:String(d.amt),acct:'cash'};return render()}
  if(a==='savePay'){var dd=p.debts.filter(function(x){return x.id===sheet.debtId})[0];var amt=parseAmt(sheet.amt);if(!(amt>0)){sheet.err='Type an amount above ₹0.';return rerenderSheet()}if(amt>dd.amt+1e-9){sheet.err='That’s more than '+money(dd.amt)+'.';return rerenderSheet()}
    var bb=balances(p);if(dd.dir==='owe'&&amt>bb[sheet.acct]+1e-9){sheet.err='You only have '+money(bb[sheet.acct])+' in '+(sheet.acct==='cash'?'cash':'your bank card')+'.';return rerenderSheet()}
    p.entries.push({id:newId(),t:Date.now(),type:dd.dir==='owe'?'out':'in',amt:amt,acct:sheet.acct,cat:dd.dir==='owe'?DEBT_OUT:DEBT_IN,note:dd.who,debtId:dd.id});adjustDebt(p,dd.id,-amt);
    sheet=null;checkAch(false);save();render();if(!document.querySelector('.toast.win'))toast(dd.settled?(dd.dir==='owe'?'Paid off '+dd.who+'!':dd.who+' is all paid up'):'Saved — '+money(dd.amt)+' left');return}
  if(a==='forgive'){if(!sheet.confirmDel){sheet.confirmDel=true;return rerenderSheet()}var fid=sheet.debtId;p.debts=p.debts.filter(function(x){return x.id!==fid});p.entries.forEach(function(e){if(e.debtId===fid)delete e.debtId});sheet=null;save();return render()}
  if(a==='delDebt'){var did=el.getAttribute('data-id');p.debts=p.debts.filter(function(x){return x.id!==did});p.entries.forEach(function(e){if(e.debtId===did)delete e.debtId});save();return render()}
  if(a==='profiles'){sheet={kind:'profiles'};return render()}
  if(a==='switch'){S.active=el.getAttribute('data-id');sheet=null;save();render();return toast('Switched to '+prof().name)}
  if(a==='newProfile'){sheet=newSetup(1);return render()}
  if(a==='obNext'){if(sheet.step===1&&!sheet.uses.length){sheet.err='Pick at least one.';return rerenderSheet()}sheet.err='';sheet.step++;return render()}
  if(a==='obBack'){sheet.err='';sheet.step--;return render()}
  if(a==='obUse'){var u=el.getAttribute('data-v'),ix=sheet.uses.indexOf(u);if(ix>=0)sheet.uses.splice(ix,1);else sheet.uses.push(u);sheet.err='';return rerenderSheet()}
  if(a==='editUses'){sheet={kind:'uses',uses:(p.uses||[]).slice()};return render()}
  if(a==='saveUses'){if(!sheet.uses.length){sheet.err='Pick at least one.';return rerenderSheet()}var addGoal=sheet.uses.indexOf('goal')>=0&&!has(p,'goal')&&!(p.goal.amount>0);p.uses=sheet.uses.slice();sheet=null;checkAch(true);save();if(addGoal){tab='plan';render();return toast('Set your goal amount in Plan')}render();return toast('Saved')}
  if(a==='rename'){sheet={kind:'rename',name:prof().name};return render()}
  if(a==='saveRename'){var rn=(sheet.name||'').trim();if(!rn){sheet.err='Name can’t be empty.';return rerenderSheet()}prof().name=rn;sheet=null;save();return render()}
  if(a==='delProfile'){if(!sheet.confirmDel){sheet.confirmDel=true;return rerenderSheet()}var gone=S.active;S.profiles=S.profiles.filter(function(x){return x.id!==gone});delete S.data[gone];S.active=S.profiles[0].id;sheet=null;save();return render()}
  if(a==='createProfile'){var s=sheet;var name=(s.name||'').trim(),cash=s.cash===''?0:parseAmt(s.cash),bank=s.bank===''?0:parseAmt(s.bank),goal=s.uses.indexOf('goal')>=0?parseAmt(s.goal):0;
    if(!name){s.err='Give this profile a name.';return rerenderSheet()}if(!(cash>=0)||!(bank>=0)){s.err='Cash and bank must be numbers (0 is fine).';return rerenderSheet()}if(s.uses.indexOf('goal')>=0&&!(goal>0)){s.err='Set a goal above ₹0.';return rerenderSheet()}if(!s.deadline||new Date(s.deadline+'T23:59:59').getTime()<Date.now()){s.err='Pick a goal date in the future.';return rerenderSheet()}
    var pid=newId(),now=Date.now();var pd={created:now,uses:s.uses.slice(),goal:{amount:goal,deadline:s.deadline||yearOut()},limit:null,limitMode:'auto',limitHist:{},monthIncome:{},entries:[],debts:[],wish:[],checkins:{},seen:[],challengesDone:[]};
    if(cash>0)pd.entries.push({id:newId(),t:now,type:'in',amt:cash,acct:'cash',cat:START,note:''});if(bank>0)pd.entries.push({id:newId(),t:now,type:'in',amt:bank,acct:'bank',cat:START,note:''});
    S.profiles.push({id:pid,name:name});S.data[pid]=pd;S.active=pid;sheet=null;tab='home';ensureAuto(pd,true);pd.seen=earned(pd);pd.recapSeen=dkey(addDays(weekStart(now),-7));save();render();return toast('Welcome, '+name)}
  if(a==='backup'){sheet={kind:'backup'};return render()}
  if(a==='copy'){var ta=$('bk');ta.select();var ok=false;try{ok=document.execCommand('copy')}catch(e){}if(navigator.clipboard)navigator.clipboard.writeText(ta.value).then(function(){sheet.copied=true;rerenderSheet()},function(){});if(ok){sheet.copied=true;rerenderSheet()}return}
  if(a==='restore'){var dta;try{dta=JSON.parse(sheet.restore||'')}catch(e){dta=null}if(!dta||!Array.isArray(dta.profiles)||!dta.data||!dta.profiles.length){sheet.err='That doesn’t look like a Savr backup.';sheet.confirm=false;return rerenderSheet()}if(!sheet.confirm){sheet.confirm=true;sheet.err='';return rerenderSheet()}S=dta;sheet=null;boot();save();return toast('Backup restored')}
});
document.addEventListener('input',function(ev){var el=ev.target,c=el.getAttribute&&el.getAttribute('data-c');if(!c)return;var p=P();
  if(c.indexOf('s.')===0){sheet[c.slice(2)]=el.value;if(sheet.err)sheet.err='';var im=$('impact');if(im)im.innerHTML=impact(p,sheet);return}
  if(c.indexOf('d.')===0){debtForm[c.slice(2)]=el.value;debtForm.err='';return}
  if(c.indexOf('w.')===0){wishForm[c.slice(2)]=el.value;wishForm.err='';return}
  if(c==='limit'){setLimit(el.value);return}
  if(c==='monthInc'){var mk=mkey(Date.now());if(el.value.trim()==='')delete p.monthIncome[mk];else{var n=parseAmt(el.value);if(n>=0)p.monthIncome[mk]=n}save();return}
  if(c==='goalAmt'){var g=parseAmt(el.value);if(g>0){p.goal.amount=g;save()}return}
  if(c==='goalDl'){if(el.value){p.goal.deadline=el.value;save()}return}
});
document.addEventListener('change',function(ev){var c=ev.target.getAttribute&&ev.target.getAttribute('data-c');if(c==='limit'||c==='monthInc'||c==='goalAmt'||c==='goalDl'){var p=P();if(c==='monthInc'&&p.limitMode==='auto')ensureAuto(p,true);checkAch(false);save();render()}});
document.addEventListener('keydown',function(ev){if(ev.key==='Enter'&&sheet&&sheet.kind==='add'&&ev.target.tagName==='INPUT'){ev.preventDefault();saveEntry()}});

boot();connect();
try{var CapApp=window.Capacitor&&window.Capacitor.Plugins&&window.Capacitor.Plugins.App;if(CapApp)CapApp.addListener('backButton',function(){if(sheet&&!(sheet.kind==='setup'&&!S.profiles.length)){sheet=null;render()}else if(sheet&&sheet.kind==='setup'&&sheet.step>0){sheet.step--;render()}else if(tab!=='home'){tab='home';render()}else{CapApp.exitApp()}})}catch(e){}
window.__stash={get S(){return S},balances:balances,streak:streak,calcWeekly:calcWeekly,goalInfo:goalInfo,challenge:challenge,earned:earned,level:level,debtTotals:debtTotals,L:L,ensureAuto:ensureAuto};
})();
